flutter_gen:
  output: lib/packages/shared/gen/


flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/
    - assets/data/
    - assets/locale/
    - assets/images/
    - assets/images/flags/
    - assets/icons/
    - assets/font/
    - assets/lottie/

  fonts:
    - family: BwAletaNo10
      fonts:
        - asset: assets/font/BwAletaNo10/BwAletaNo10_ExtraLight.ttf
          weight: 200
        - asset: assets/font/BwAletaNo10/BwAletaNo10_Light.ttf
          weight: 300
        - asset: assets/font/BwAletaNo10/BwAletaNo10_Regular.ttf
          weight: 400
        - asset: assets/font/BwAletaNo10/BwAletaNo10_Medium.ttf
          #          weight: 500
          #        - asset: assets/font/BwAletaNo10/BwAletaNo10_SemiBold.ttf
          weight: 600
        - asset: assets/font/BwAletaNo10/BwAletaNo10_Bold.ttf
          weight: 700
        - asset: assets/font/BwAletaNo10/BwAletaNo10_ExtraBold.ttf
          weight: 800
    - family: CustomIcon
      fonts:
        - asset: assets/icons/CustomIcon.ttf
    - family: InventoryIcon
      fonts:
        - asset: assets/icons/InventoryIcon.ttf
    - family: MenuIcons
      fonts:
        - asset: assets/icons/MenuIcons.ttf
    - family: Menu_search
      fonts:
        - asset: assets/icons/Menu_search.ttf
    - family: EmplyeeIcons
      fonts:
        - asset: assets/icons/EmplyeeIcons.ttf