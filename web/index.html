<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Coozy The Cafe">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Coozy The Cafe">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon_circle.png" />

  <title>Coozy The Cafe</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Fonts: Outfit for brand, Caveat for realistic cursive neon sign -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Outfit:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <meta name="theme-color" content="#1c110c">

  <style>
    /* CSS Variables: Coozy The Cafe warm palette */
    :root {
      --bg-dark-start: #1c110c;
      --bg-dark-mid: #291811;
      --bg-dark-end: #120a06;
      --primary: #a43c12;
      --primary-bright: #ff8a5c;
      --primary-container: #ff9068;
      --caramel-accent: #f59e0b;
      --amber-gold: #fbbf24;
      --text-main: #fff8f6;
      --text-muted: #dec0b6;
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 180, 154, 0.15);
      --glass-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    /* Reset & full viewport setup */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg-dark-start);
      overflow: hidden;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Web pre-loader container */
    #app-loading-indicator {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 999999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 38%, var(--bg-dark-mid) 0%, var(--bg-dark-start) 60%, var(--bg-dark-end) 100%);
      transition: opacity 0.45s cubic-bezier(0.4, 0, 0.2, 1);
      user-select: none;
      -webkit-user-select: none;
    }

    /* Soft ambient cafe glow */
    .loading-glow {
      position: absolute;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(255, 138, 92, 0.22) 0%, rgba(245, 158, 11, 0.12) 45%, transparent 70%);
      border-radius: 50%;
      animation: pulseGlow 3s infinite ease-in-out;
      pointer-events: none;
    }

    /* Logo card container with glassmorphic depth */
    .logo-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      box-shadow: var(--glass-shadow);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      animation: floatLogo 3.2s ease-in-out infinite;
    }

    .logo-container img {
      width: 110px;
      height: 110px;
      max-width: 25vw;
      max-height: 25vw;
      object-fit: contain;
      filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.45));
    }

    /* App branding title */
    .loading-title {
      margin-top: 22px;
      color: var(--text-main);
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
    }

    /* Neon sign tagline: Sip.Savor.Relax (Blue Neon) */
    .loading-tagline {
      margin-top: 8px;
      font-family: 'Caveat', cursive, sans-serif;
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #ffffff;
      text-transform: none;
      /* Realistic multi-layer cyan/ice-blue neon glow */
      text-shadow:
        0 0 2px #ffffff,
        0 0 5px #e0f7ff,
        0 0 10px #70d6ff,
        0 0 20px #00b4d8,
        0 0 35px #0077b6,
        0 0 50px rgba(0, 180, 216, 0.6);
      /* Subtle clear acrylic backing illusion */
      padding: 2px 14px;
      border-radius: 999px;
      background: rgba(0, 180, 216, 0.06);
      border: 1px solid rgba(112, 214, 255, 0.18);
      box-shadow: 0 0 20px rgba(0, 180, 216, 0.15), inset 0 0 10px rgba(0, 180, 216, 0.08);
      animation: neonGlow 3s ease-in-out infinite;
    }

    @keyframes neonGlow {

      0%,
      100% {
        opacity: 0.96;
        text-shadow:
          0 0 2px #ffffff,
          0 0 5px #e0f7ff,
          0 0 10px #70d6ff,
          0 0 20px #00b4d8,
          0 0 35px #0077b6,
          0 0 50px rgba(0, 180, 216, 0.55);
      }

      50% {
        opacity: 1;
        text-shadow:
          0 0 3px #ffffff,
          0 0 7px #e0f7ff,
          0 0 14px #70d6ff,
          0 0 26px #00b4d8,
          0 0 45px #0096c7,
          0 0 65px rgba(0, 180, 216, 0.75);
      }
    }

    /* Loading status text */
    .loading-status {
      margin-top: 14px;
      color: var(--text-muted);
      font-size: 0.82rem;
      font-weight: 400;
      letter-spacing: 0.4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Progress bar track */
    .progress-track {
      margin-top: 22px;
      width: 180px;
      max-width: 65vw;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.4);
    }

    /* Animated warm progress line */
    .progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 45%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--primary), var(--primary-bright) 50%, var(--amber-gold) 100%);
      box-shadow: 0 0 10px rgba(255, 138, 92, 0.7);
      animation: indeterminateProgress 1.6s infinite cubic-bezier(0.65, 0.815, 0.735, 0.395);
    }

    @keyframes pulseGlow {

      0%,
      100% {
        transform: scale(0.92);
        opacity: 0.65;
      }

      50% {
        transform: scale(1.15);
        opacity: 1;
      }
    }

    @keyframes floatLogo {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-6px);
      }
    }

    @keyframes indeterminateProgress {
      0% {
        left: -40%;
        width: 40%;
      }

      50% {
        left: 25%;
        width: 60%;
      }

      100% {
        left: 100%;
        width: 30%;
      }
    }
  </style>
</head>

<body>
  <!-- Pre-Flutter web initialization loader -->
  <div id="app-loading-indicator">
    <div class="loading-glow"></div>
    <div class="logo-container">
      <img src="app_logo_clear_bg.png" alt="Coozy The Cafe" onerror="this.src='favicon_circle.png'" />
    </div>
    <div class="loading-title">Coozy The Cafe</div>
    <div class="loading-tagline">Sip.Savor.Relax</div>
    <!-- <div class="loading-status">Brewing your experience...</div> -->
    <div class="progress-track">
      <div class="progress-bar"></div>
    </div>
  </div>

  <!-- PDF.js library required for syncfusion_flutter_pdfviewer on Flutter Web -->
  <script type="module" async>
    import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs';
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";
  </script>

  <script>
    {{flutter_bootstrap_js}}
  </script>
  <script>
    window.addEventListener('load', function () {
      const loader = document.getElementById('app-loading-indicator');
      const removeLoader = function () {
        if (loader && loader.parentElement) {
          loader.style.opacity = '0';
          setTimeout(function () {
            if (loader.parentElement) {
              loader.parentElement.removeChild(loader);
            }
          }, 500);
        }
      };

      if (window._flutter && window._flutter.loader) {
        window._flutter.loader.load({
          config: {
            suppressMultithreadingWarning: true
          },
          onEntrypointLoaded: async function (engineInitializer) {
            const appRunner = await engineInitializer.initializeEngine();
            removeLoader();
            await appRunner.runApp();
          }
        });
      } else {
        // Fallback for custom or direct bootstrap script
        const observer = new MutationObserver(function (mutations, obs) {
          const fltGlassPane = document.querySelector('flt-glass-pane') || document.querySelector('flutter-view');
          if (fltGlassPane) {
            obs.disconnect();
            removeLoader();
          }
        });
        observer.observe(document.body, { childList: true, subtree: true });
        setTimeout(removeLoader, 10000);
      }
    });
  </script>
</body>

</html>
