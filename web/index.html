<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Coozy The Cafe">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Coozy The Cafe">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon_circle.png" />

  <title>Coozy The Cafe</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Reset & full viewport setup */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #121212;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Web pre-loader container */
    #app-loading-indicator {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 999999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1A121F 0%, #161B2E 50%, #0F2027 100%);
      transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Subtle pulsing glow behind the logo */
    .loading-glow {
      position: absolute;
      width: 260px;
      height: 260px;
      background: radial-gradient(circle, rgba(225, 109, 245, 0.25) 0%, rgba(5, 222, 250, 0.15) 50%, transparent 70%);
      border-radius: 50%;
      animation: pulseGlow 2.5s infinite ease-in-out;
      pointer-events: none;
    }

    /* Logo card container */
    .logo-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      animation: floatLogo 3s ease-in-out infinite;
    }

    .logo-container img {
      width: 120px;
      height: 120px;
      object-fit: contain;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.3));
    }

    /* App title */
    .loading-title {
      margin-top: 24px;
      color: #FFFFFF;
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }

    /* Loading status text */
    .loading-status {
      margin-top: 8px;
      color: rgba(255, 255, 255, 0.65);
      font-size: 0.85rem;
      letter-spacing: 0.3px;
    }

    /* Progress bar track */
    .progress-track {
      margin-top: 28px;
      width: 200px;
      height: 4px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }

    /* Animated progress line */
    .progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 45%;
      border-radius: 999px;
      background: linear-gradient(90deg, #E16DF5, #05DEFA);
      animation: indeterminateProgress 1.6s infinite cubic-bezier(0.65, 0.815, 0.735, 0.395);
    }

    @keyframes pulseGlow {
      0%, 100% {
        transform: scale(0.9);
        opacity: 0.6;
      }
      50% {
        transform: scale(1.15);
        opacity: 1;
      }
    }

    @keyframes floatLogo {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-6px);
      }
    }

    @keyframes indeterminateProgress {
      0% {
        left: -40%;
        width: 40%;
      }
      50% {
        left: 25%;
        width: 60%;
      }
      100% {
        left: 100%;
        width: 30%;
      }
    }
  </style>
</head>
<body>
  <!-- Pre-Flutter web initialization loader -->
  <div id="app-loading-indicator">
    <div class="loading-glow"></div>
    <div class="logo-container">
      <img src="app_logo_clear_bg.png" alt="Coozy The Cafe" onerror="this.src='favicon_circle.png'" />
    </div>
    <div class="loading-title">Coozy The Cafe</div>
    <div class="loading-status">Starting up...</div>
    <div class="progress-track">
      <div class="progress-bar"></div>
    </div>
  </div>

  <!-- PDF.js library required for syncfusion_flutter_pdfviewer on Flutter Web -->
  <script type="module">
    import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs';
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";
  </script>
  <script>
    {{flutter_bootstrap_js}}
  </script>
  <script>
    window.addEventListener('load', function () {
      const loader = document.getElementById('app-loading-indicator');
      const removeLoader = function () {
        if (loader && loader.parentElement) {
          loader.style.opacity = '0';
          setTimeout(function () {
            if (loader.parentElement) {
              loader.parentElement.removeChild(loader);
            }
          }, 500);
        }
      };

      if (window._flutter && window._flutter.loader) {
        window._flutter.loader.load({
          onEntrypointLoaded: async function (engineInitializer) {
            const appRunner = await engineInitializer.initializeEngine();
            removeLoader();
            await appRunner.runApp();
          }
        });
      } else {
        // Fallback for custom or direct bootstrap script
        const observer = new MutationObserver(function (mutations, obs) {
          const fltGlassPane = document.querySelector('flt-glass-pane') || document.querySelector('flutter-view');
          if (fltGlassPane) {
            obs.disconnect();
            removeLoader();
          }
        });
        observer.observe(document.body, { childList: true, subtree: true });
        setTimeout(removeLoader, 10000);
      }
    });
  </script>
</body>

</html>
